version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: kirana_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kirana
      POSTGRES_PASSWORD: kirana_dev_password
      POSTGRES_DB: kirana_inventory
    ports:
      - "5432:5432"
    volumes:
      - kirana_pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  server:
    build: ./server
    container_name: kirana_server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://kirana:kirana_dev_password@db:5432/kirana_inventory
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 12h
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./server/src:/app/src

  web:
    build: ./web
    container_name: kirana_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  kirana_pgdata:
